# SPDX-License-Identifier: BSD-3-Clause
#
# Manual runs only. To build every push and pull request, add
#   push:
#   pull_request:
# under "on:" (README.md "Continuous integration").
name: build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie-slim
      options: --security-opt seccomp=unconfined
    steps:
      - name: Install the toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates gcc \
            libc6-dev linux-libc-dev git meson ninja-build \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and test
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/ci.sh out
      - uses: actions/upload-artifact@v4
        with:
          name: vqda-aarch64
          path: out
